<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>RikkaAI 首页</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <div class="app-shell">
    <section class="stage">
      <div class="stage-wash" aria-hidden="true"></div>
      <div class="window-drag-region" aria-hidden="true"></div>
      <header class="desktop-toolbar glass" aria-label="首页快捷工具">
        <button class="toolbar-search" type="button" data-focus-input>
          <img src="../../ui_assets/03_Icons/Outline/search.svg" alt="">
          <span>搜索</span>
          <kbd>Ctrl + K</kbd>
        </button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button class="toolbar-icon" type="button" data-section="memo" aria-label="备忘录">
          <img src="../../ui_assets/03_Icons/Outline/notification.svg" alt="">
        </button>
        <button class="toolbar-icon" type="button" data-section="tools" aria-label="工具箱">
          <img src="../../ui_assets/03_Icons/Outline/plugin.svg" alt="">
        </button>
        <button class="toolbar-icon" type="button" data-section="settings" aria-label="设置">
          <img src="../../ui_assets/03_Icons/Outline/settings.svg" alt="">
        </button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button class="window-button" type="button" data-window-action="minimize" aria-label="最小化">−</button>
        <button class="window-button" type="button" data-window-action="maximize" aria-label="最大化">□</button>
        <button class="window-button close" type="button" data-window-action="close" aria-label="关闭">×</button>
        <button class="toolbar-profile" type="button" data-section="settings">
          <img src="../../assets/images/avatar.png" alt="六花">
          <strong>六花</strong>
        </button>
        <span class="toolbar-drag-handle" aria-hidden="true"></span>
      </header>
      <main class="home-main">
        <header class="greeting reveal" style="--delay: 0ms">
          <h1 id="greeting-title">欢迎回来，主人</h1>
          <p id="greeting-subtitle">今天想和我聊些什么呢？</p>
        </header>

        <section class="composer glass reveal" style="--delay: 70ms" aria-label="开始对话">
          <div class="composer-top">
            <textarea id="home-input" rows="2" placeholder="输入消息，和六花开始新的对话..."></textarea>
            <button id="send-button" class="send-button" type="button" aria-label="发送消息">
              <img src="../../assets/figma/icons/send.svg" alt="">
            </button>
          </div>
          <div id="mode-actions" class="mode-actions"></div>
        </section>

        <section class="quick-section reveal" style="--delay: 140ms">
          <div class="section-heading">
            <div>
              <span class="section-kicker">EXPLORE</span>
              <h2>快速开始</h2>
            </div>
          </div>
          <div id="quick-actions" class="quick-grid"></div>
        </section>

        <section class="recent-section reveal" style="--delay: 210ms">
          <div class="section-heading compact">
            <div>
              <span class="section-kicker">CONTINUE</span>
              <h2>最近对话</h2>
            </div>
            <button class="text-button" data-section="history" type="button">查看全部 <span>›</span></button>
          </div>
          <div id="recent-list" class="recent-list glass"></div>
        </section>
      </main>

      <aside class="right-rail reveal" style="--delay: 120ms" aria-label="首页信息">
        <section class="rail-card glass">
          <div class="rail-heading">
            <div><span class="section-kicker">OVERVIEW</span><h2>数据概览</h2></div>
            <button class="icon-button" type="button" data-section="summary" aria-label="查看详情">›</button>
          </div>
          <div id="stats-grid" class="stats-grid"></div>
          <div class="trend-heading"><strong>对话趋势</strong><small>消息数 · 近 7 天</small></div>
          <div id="overview-chart" class="overview-chart"><span>暂无趋势数据</span></div>
          <div id="overview-summary" class="overview-summary"></div>
        </section>

        <section class="rail-card glass">
          <div class="rail-heading">
            <div><span class="section-kicker">TOOLKIT</span><h2>常用工具</h2></div>
          </div>
          <div id="tool-grid" class="tool-grid"></div>
        </section>

      </aside>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="scripts/components.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
